name: Build macOS app (unsigned)

# Builds a macOS disk image of *this fork*.
#
# The upstream workflow (python-app.yml) builds the upstream fontra from
# git, and then signs and notarizes the result — which needs the signing
# certificate and the notarization credentials that this fork does not have.
#
# This workflow builds the fontra of the fork's own branch instead, and
# produces an *unsigned* disk image. It is meant for testing on Apple
# Silicon; a signed build needs the certificates.

on:
  workflow_dispatch:
    inputs:
      fontra_ref:
        description: "The fontra branch to build"
        default: "code-review-feedback-42427"
        required: false
        type: string

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Git checkout (fontra-pak)
        uses: actions/checkout@v4

      - name: Git checkout (fontra)
        uses: actions/checkout@v4
        with:
          repository: MekaClaude/fontra
          ref: ${{ inputs.fontra_ref }}
          path: fontra

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: fontra/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          # Install the fontra of the fork instead of the upstream one, so
          # that the app is the fork's. The wheel build hook of fontra runs
          # `npm install` and `npm run bundle`, so the client bundle in the
          # image is the one of this fork.
          sed 's|git+https://github.com/fontra/fontra.git|./fontra|' requirements.txt > requirements-fork.txt
          pip install -r requirements-fork.txt 2>&1 | tee pip_log.txt
          pip install -r requirements-dev.txt

      - name: Make and install universal wheels
        run: |
          # FontraPak.spec builds a universal2 app, so every compiled
          # dependency has to be a fat binary. The wheels that pip serves
          # on an arm64 runner are arm64 only, so they are merged into
          # universal2 wheels first.
          pip install delocate
          python macos/ensure_universal_wheels.py pip_log.txt
          pip install --force build/universal_wheels/*.whl

      - name: Stamp the version
        run: |
          python - <<'EOF'
          import datetime
          import pathlib
          import re
          import zoneinfo

          import fontra

          now = datetime.datetime.now(zoneinfo.ZoneInfo("Europe/Paris"))
          version = f"{now.year}.{now.month:02d}.{now.day:02d}.{now.hour:02d}"
          path = pathlib.Path(fontra.__file__).parent / "_version.py"
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r"__version__ = version = '[^']*'",
              f"__version__ = version = '{version}'",
              text,
          )
          text = re.sub(
              r"__version_tuple__ = version_tuple = \([^)]*\)",
              f"__version_tuple__ = version_tuple = "
              f"({now.year}, {now.month:02d}, {now.day:02d}, {now.hour:02d})",
              text,
          )
          path.write_text(text, encoding="utf-8")
          print("stamped", version)
          EOF

      - name: Build app with PyInstaller
        run: pyinstaller FontraPak.spec -y

      - name: Check what the app contains
        run: |
          # The plug-ins of the fork must be inside the bundle, and the
          # client must be the bundle of the fork.
          echo "--- plug-in manifests in the app ---"
          find "dist/Fontra Pak.app" -name plugin.json | sort
          echo "--- the course corpus ---"
          find "dist/Fontra Pak.app" -name course.json -exec ls -la {} \;
          echo "--- the client bundle ---"
          find "dist/Fontra Pak.app" -name "fontra-core*.js" -exec ls -la {} \;
          echo "--- the app identity ---"
          plutil -p "dist/Fontra Pak.app/Contents/Info.plist" | head -20

      - name: Build the disk image
        run: |
          python macos/build_dmg.py "dist/Fontra Pak.app" "dist/FontraPak-MacOS-arm64.dmg"
          ls -la dist

      - name: Store the disk image
        uses: actions/upload-artifact@v4
        with:
          name: FontraPak-MacOS-arm64
          path: ./dist/*.dmg
